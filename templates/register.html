{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4 p-4 shadow">
            <h3 class="text-center text-info mb-4 fw-bold">REGISTER ACCOUNT</h3>
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-3">
                    <label>Role</label>
                    <select name="role" class="form-select bg-dark text-light">
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light" required>
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold mb-2">CREATE ACCOUNT</button>
                <a href="{{ url_for('login') }}" class="btn btn-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

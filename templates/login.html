{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-5 p-4 shadow">
            <h3 class="text-center text-primary mb-4 fw-bold">SYSTEM LOGIN</h3>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mb-3">LOGIN</button>
            </form>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('register') }}" class="btn btn-outline-info btn-sm">Register Account</a>
                <a href="{{ url_for('reset_request') }}" class="btn btn-outline-warning btn-sm">Forgot Password?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

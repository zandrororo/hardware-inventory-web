{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-5 p-4 shadow">
            <h3 class="text-center text-primary mb-4 fw-bold">SYSTEM LOGIN</h3>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" name="password" id="password" class="form-control bg-dark text-light" required>
                    <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="showPassword" onclick="togglePassword()" style="cursor: pointer;">
    <label for="showPassword" style="color: #a0a0a0; font-size: 14px; cursor: pointer;">Show Password</label>
</div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mb-3">LOGIN</button>
            </form>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('register') }}" class="btn btn-outline-info btn-sm">Register Account</a>
                <a href="{{ url_for('reset_request') }}" class="btn btn-outline-warning btn-sm">Forgot Password?</a>
            </div>
        </div>
    </div>
</div>
<script>
    function togglePassword() {
        var passInput = document.getElementById("password");
        if (passInput.type === "password") {
            passInput.type = "text";
        } else {
            passInput.type = "password";
        }
    }
</script>
{% endblock %}
